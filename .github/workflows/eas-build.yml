name: EAS Build

# Native builds cost time/credits, so this is manual-trigger only.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, all]
        default: ios
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        default: production

jobs:
  build:
    name: Build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret is required for EAS builds."
            echo "See https://docs.expo.dev/build/building-on-ci"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      # Node 22 is required by eas-cli's dependency tree, not by this app —
      # see the matching note in ci.yml.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
